<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>JARVIS</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="grid"></div>

<header>

<div class="system">

JARVIS

<div class="subtitle">

STARK INDUSTRIES

</div>

</div>

<div class="time">

<div id="clock"></div>

<div id="date"></div>

</div>

</header>

<main>

<section class="left">

<div class="panel">

VOICE ENGINE

</div>

<div class="panel">

FINANCE ENGINE

</div>

<div class="panel">

SEARCH ENGINE

</div>

</section>

<section class="center">

<div class="reactor">

<div class="ring outer"></div>

<div class="ring middle"></div>

<div class="ring inner"></div>

<div class="core"></div>

</div>

<div class="console">

<div id="output">

SYSTEM ONLINE

</div>

</div>

</section>

<section class="right">

<div class="panel">

ACTIVE PROCESSES

</div>

<div class="panel">

SYSTEM STATUS

</div>

<div class="panel">

NETWORK

</div>

</section>

</main>

<footer>

<input
id="command"
placeholder="ENTER COMMAND">

<button>

EXECUTE

</button>

</footer>

<script src="app.js"></script>

</body>
</html>
