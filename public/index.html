<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>JARVIS</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="grid"></div>

<header>

<div class="system">

JARVIS

<div class="subtitle">

STARK INDUSTRIES

</div>

</div>

<div class="time">

<div id="clock"></div>

<div id="date"></div>

</div>

</header>

<main>

<section class="left">

<div class="panel voice-panel">

    <div class="voice-title">

        VOICE ENGINE

    </div>

    <div class="voice-wave">

        <div class="bar bar1"></div>
        <div class="bar bar2"></div>
        <div class="bar bar3"></div>
        <div class="bar bar4"></div>
        <div class="bar bar5"></div>
        <div class="bar bar6"></div>
        <div class="bar bar7"></div>
        <div class="bar bar8"></div>

    </div>

    <div class="voice-status">

        LISTENING...

    </div>

</div>

<div class="panel">

FINANCE ENGINE

</div>

<div class="panel">

SEARCH ENGINE

</div>

<div class="panel radar-panel">

<div class="radar">

<div class="radar-ring ring-a"></div>

<div class="radar-ring ring-b"></div>

<div class="radar-line"></div>

<div class="radar-dot dot-1"></div>

<div class="radar-dot dot-2"></div>

<div class="radar-center"></div>

</div>

</div>

</section>

    <section class="center">

 <div class="reactor">

    <div class="reactor-spokes"></div>

    <div class="outer-ring"></div>

    <div class="middle-ring"></div>

    <div class="inner-ring"></div>

    <div class="reactor-core"></div>

</div>
    <div class="console">

        <div id="output"></div>

    </div>

</section>
  
<section class="right">

<div class="panel">

ACTIVE PROCESSES

</div>

<div class="panel">

SYSTEM STATUS

</div>

<div class="panel">

NETWORK

</div>

</section>

</main>

<footer>

<input
id="command"
placeholder="ENTER COMMAND">

<button id="execute">
    
    EXECUTE
    
</button>
    
</footer>

<script src="app.js"></script>

</body>
</html>
